apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthpulse-prod
  namespace: argocd
  labels:
    app: healthpulse
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/your-group/healthpulse-cd.git   # <-- must end in .git
    targetRevision: main                     # HEAD = main; prod overlay updated only via merged PRs
    path: kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: healthpulse-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # No 'automated' block -- manual sync required
    # Prod overlay is NEVER updated by CI -- only via merged PR
